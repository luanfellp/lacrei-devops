name: CI/CD - Lacrei DevOps

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/lacrei-api
  CONTAINER_NAME: lacrei_api
  IMAGE_TAG: ${{ github.sha }}
  STAGING_URL: https://staging-api.luanmoura.com
  PROD_URL: https://api.luanmoura.com

jobs:
  validate:
    name: Lint e testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

  build-and-push:
    name: Build da imagem
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login no GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  deploy-staging:
    name: Deploy staging
    needs: build-and-push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          script: |
            set -e

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

            docker pull ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true

            docker run -d \
              -p 80:3000 \
              --name ${{ env.CONTAINER_NAME }} \
              --restart always \
              -e APP_ENV=staging \
              -e APP_VERSION=${{ env.IMAGE_TAG }} \
              ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Smoke test
        run: |
          sleep 5
          curl --fail --retry 3 --retry-delay 3 \
            ${{ env.STAGING_URL }}/status

  deploy-production:
    name: Deploy production
    needs: deploy-staging
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          script: |
            set -e

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

            docker pull ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true

            docker run -d \
              -p 80:3000 \
              --name ${{ env.CONTAINER_NAME }} \
              --restart always \
              -e APP_ENV=production \
              -e APP_VERSION=${{ env.IMAGE_TAG }} \
              ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Smoke test
        run: |
          sleep 5
          curl --fail --retry 3 --retry-delay 3 \
            ${{ env.PROD_URL }}/status